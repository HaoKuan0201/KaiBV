name: Deploy to GitHub Pages (Vite)

# 觸發條件: 程式碼被推送到 main 分支時
on:
  push:
    branches:
      - main
  # 允許手動從 Actions 頁面觸發部署
  workflow_dispatch:

# 關鍵設定: 必須授予 Actions 寫入 Pages 的權限
permissions:
  contents: read
  pages: write
  id-token: write

# 並行控制: 確保只有一個部署任務在執行
concurrency:
  cancel-in-progress: true
  group: pages

jobs:
  # 1. 建置前端專案 (Build Job)
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          # 使用 Node.js LTS 版本
          node-version: 20 
          cache: 'npm' # 啟用快取以加速安裝

      - name: Install Dependencies
        run: npm install

      - name: Run Vite Build
        # 執行建置指令，靜態檔案將輸出到 dist 資料夾
        run: npm run build

      - name: Setup Pages Artifact
        # 將建置後的 dist 資料夾內容上傳，作為部署的 artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # 2. 部署到 GitHub Pages (Deployment Job)
  deploy:
    environment:
      # 參考 GitHub Pages 環境
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build # 確保建置工作完成後才執行部署
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # 使用官方的 deploy-pages action 進行部署
        uses: actions/deploy-pages@v4